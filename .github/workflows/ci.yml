name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_MIN_RELEASE_AGE: 0

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify both extension packages build
        run: npm run pack

      - name: Verify docs/index.html is up to date with README.md
        run: |
          npm run docs
          if ! git diff --quiet -- docs/index.html; then
            echo "::error::docs/index.html is out of date. Run 'npm run docs' and commit the result."
            git diff -- docs/index.html
            exit 1
          fi
